apiVersion: v1
kind: Namespace
metadata:
  name: raiaas-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: raiaas-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: raiaas/api-gateway:v1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: raiaas-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: api-gateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: raiaas-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.raiaas.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 80
